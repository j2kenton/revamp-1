<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="AI Playroom logo: toy alphabet blocks spelling AI">
  <!-- Tilted top block with star -->
  <g transform="rotate(-10 32 18)">
    <rect x="20" y="5" width="24" height="24" rx="6" fill="#FBBF24"/>
    <path d="M32 10.5l2.1 4.3 4.7.7-3.4 3.3.8 4.7L32 21.3l-4.2 2.2.8-4.7-3.4-3.3 4.7-.7z" fill="#FFFFFF" opacity="0.95"/>
  </g>
  <!-- Green ball -->
  <circle cx="55" cy="12" r="6" fill="#34D399"/>
  <circle cx="53" cy="10" r="1.8" fill="#FFFFFF" opacity="0.7"/>
  <!-- Bottom blocks: A + I -->
  <rect x="4" y="34" width="26" height="26" rx="6" fill="#F25C54"/>
  <text x="17" y="47.5" text-anchor="middle" dominant-baseline="central" font-family="ui-rounded, 'Segoe UI', system-ui, sans-serif" font-size="17" font-weight="800" fill="#FFFFFF">A</text>
  <rect x="34" y="34" width="26" height="26" rx="6" fill="#3B82F6"/>
  <text x="47" y="47.5" text-anchor="middle" dominant-baseline="central" font-family="ui-rounded, 'Segoe UI', system-ui, sans-serif" font-size="17" font-weight="800" fill="#FFFFFF">I</text>
</svg>
